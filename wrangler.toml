name = "cms-outbound"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Send due emails, sync replies, retry webhooks, renew Gmail watches.
[triggers]
crons = ["* * * * *"]

# On the SleekSite platform there's no cron: this Durable Object runs the same work on a 1-minute alarm.
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

[[d1_databases]]
binding = "DB"
database_name = "cms-outbound"
# From `npx wrangler d1 create cms-outbound` (deploy:tenant looks it up by name)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Everything else (app name, Google OAuth client, OpenRouter key and model, Gmail Pub/Sub topic, emails per minute,
# public URL) is set in the app's Settings page after deploy. The first person to open the app chooses the passcode
# (sign-in, API and MCP key). Optional for older installs: a PASSCODE secret set at deploy time still works.
